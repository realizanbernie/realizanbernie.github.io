<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Slider</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    .slider {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }

    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: #111;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    button:hover {
      background: #fff;
    }

    .counter {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="counter" id="counter">1 / 3</div>

    <div class="slide active">
      <img src="https://picsum.photos/id/1015/1600/900" alt="Slide 1">
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1016/1600/900" alt="Slide 2">
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1018/1600/900" alt="Slide 3">
    </div>

    <div class="controls">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let index = 0;
    let timer;

    function showSlide(i) {
      slides[index].classList.remove('active');
      index = (i + slides.length) % slides.length;
      slides[index].classList.add('active');
      counter.textContent = `${index + 1} / ${slides.length}`;
    }

    function nextSlide() {
      showSlide(index + 1);
      resetTimer();
    }

    function prevSlide() {
      showSlide(index - 1);
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timer);
      timer = setInterval(nextSlide, 4000);
    }

    nextBtn.addEventListener('click', nextSlide);
    prevBtn.addEventListener('click', prevSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    timer = setInterval(nextSlide, 4000);
  </script>
</body>
</html>
