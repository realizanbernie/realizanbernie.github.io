<script>
(function () {
    "use strict";

    const root = document.getElementById("pwHolidayRoad");
    if (!root || root.dataset.initialized === "true") return;
    root.dataset.initialized = "true";

    const $ = id => document.getElementById(id);

    const movingEvent = $("pwMovingEvent");
    const eventIcon = $("pwEventIcon");
    const status = $("pwRoadStatus");
    const caption = $("pwRoadCaption");
    const note = $("pwRoadNote");
    const calendarItems = Array.from(
        root.querySelectorAll(".pw-calendar-item")
    );

    // Philippines local time, independent of the visitor's device timezone.
    function phNow() {
        const parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Manila",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(new Date());

        const v = {};
        parts.forEach(p => {
            if (p.type !== "literal") v[p.type] = Number(p.value);
        });

        return {
            year: v.year,
            month: v.month,
            day: v.day,
            hour: v.hour,
            minute: v.minute,
            second: v.second,
            // A UTC-like number representing Philippine wall-clock time.
            wall: Date.UTC(
                v.year, v.month - 1, v.day,
                v.hour, v.minute, v.second
            )
        };
    }

    function makeDate(year, month, day) {
        return Date.UTC(year, month - 1, day, 0, 0, 0);
    }

    function eventsFor(now) {
        const y = now.year;

        return [
            {
                id: "souls",
                month: 11,
                day: 1,
                name: "All Saints’ Day",
                short: "ALL SAINTS",
                icon: "🕯️",
                message: "Remembering loved ones"
            },
            {
                id: "souls",
                month: 11,
                day: 2,
                name: "All Souls’ Day",
                short: "ALL SOULS",
                icon: "🕯️",
                message: "A day of remembrance"
            },
            {
                id: "christmas",
                month: 12,
                day: 25,
                name: "Christmas Day",
                short: "CHRISTMAS",
                icon: "🎅",
                message: "Christmas magic is getting closer"
            },
            {
                id: "newyear",
                month: 1,
                day: 1,
                name: "New Year’s Day",
                short: "NEW YEAR",
                icon: "🎆",
                message: "A fresh year, a fresh beginning"
            }
        ].map(e => {
            let year = y;
            let target = makeDate(year, e.month, e.day);

            // Select the next occurrence of each annual event.
            if (target <= now.wall) {
                year++;
                target = makeDate(year, e.month, e.day);
            }

            return { ...e, year, target };
        }).sort((a, b) => a.target - b.target);
    }

    function durationText(ms) {
        if (ms <= 0) return "Today!";

        const seconds = Math.floor(ms / 1000);
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        if (days > 0) {
            return days + "d " + hours + "h " + minutes + "m remaining";
        }

        if (hours > 0) {
            return hours + "h " + minutes + "m " + secs + "s remaining";
        }

        return minutes + "m " + secs + "s remaining";
    }

    function update() {
        const now = phNow();
        const events = eventsFor(now);

        // Upcoming event with the shortest remaining time.
        const next = events[0];
        const remaining = Math.max(0, next.target - now.wall);

        /*
         * REAL TIME POSITION:
         * The marker starts at the left of the road when the event
         * is far away, then approaches the fixed person as the date
         * approaches. On the event date it reaches the person.
         *
         * The 90-day approach window is only the visual road scale.
         * Remaining time itself is calculated from the actual calendar.
         */
        const approachWindow = 90 * 86400000;
        const fraction = Math.max(
            0,
            Math.min(1, 1 - remaining / approachWindow)
        );

        // Road coordinate: 8% at the start, 50% on event day.
        const position = 8 + fraction * 42;

        movingEvent.style.left = position + "%";
        eventIcon.textContent = next.icon;
        status.textContent = next.short;

        caption.innerHTML =
            "<strong>" + next.icon + " " + next.name +
            "</strong> · " + durationText(remaining);

        note.textContent =
            next.message + " · Philippine time (PHT)";

        // Calendar shows the next date for each milestone.
        calendarItems.forEach(item => {
            const id = item.dataset.event;
            const event = events.find(e => e.id === id);

            item.classList.remove("is-next", "is-passed");

            if (!event) return;

            item.querySelector("strong").textContent =
                String(event.day).padStart(2, "0");

            item.querySelector("small").textContent =
                ({
                    1: "JAN",
                    11: "NOV",
                    12: "DEC"
                })[event.month];

            if (event.id === next.id) {
                item.classList.add("is-next");
            }
        });
    }

    update();
    window.setInterval(update, 1000);
})();
</script>
