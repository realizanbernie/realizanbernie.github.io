<html>

<head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PISO WIFI.br holiday countdown and journey">
    <title>PISO WIFI.br Holiday Journey</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .pw-xmas-footer {
            width: 100%;
            margin: 0;
            padding: 8px 6px 10px;
            overflow: hidden;
            background: #000;
            color: #fff;
            text-align: center;
        }

        .pw-mini-brand {
            margin: 0 0 5px;
            color: #ffcf27;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            animation: pw-brand-glow 2s ease-in-out infinite alternate;
        }

        @keyframes pw-brand-glow {
            from {
                opacity: .7;
                text-shadow: 0 0 3px #ffcc0030;
            }
            to {
                opacity: 1;
                text-shadow: 0 0 11px #ffcc0090;
            }
        }

        /* Countdown */
        .pw-xmas-units {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 8px 5px;
            border: 1px solid #c9a52b;
            border-radius: 15px;
            background: linear-gradient(130deg, #103c2a, #11101c 70%, #481c21);
            box-shadow: 0 0 12px #ffcc0025;
            animation: pw-countdown-glow 4s ease-in-out infinite;
        }

        @keyframes pw-countdown-glow {
            0%, 100% {
                box-shadow: 0 0 5px #ffcc0020;
                border-color: #8b762a;
            }
            50% {
                box-shadow: 0 0 17px #ffcc0060, 0 0 8px #00ed7530;
                border-color: #ffcf27;
            }
        }

        .pw-xmas-unit {
            flex: 1 1 0;
            min-width: 0;
            max-width: 80px;
            padding: 7px 1px;
            border: 1px solid #ffffff30;
            border-radius: 8px;
            background: #0005;
        }

        .pw-xmas-number {
            display: block;
            color: #ffcf27;
            font-size: 20px;
            font-weight: 900;
            line-height: 1.15;
        }

        .pw-xmas-label {
            display: block;
            margin-top: 4px;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: .4px;
        }

        /* Journey panel */
        .pw-road-panel {
            width: 100%;
            max-width: 360px;
            margin: 10px auto 0;
            padding: 10px 9px 9px;
            border: 1px solid #ffffff22;
            border-radius: 13px;
            background: radial-gradient(
                ellipse at top,
                #102b22 0%,
                #101019 58%,
                #080808 100%
            );
            box-shadow: inset 0 0 16px #00ed7508, 0 0 13px #000;
        }

        .pw-road-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
            text-align: right;
        }

        .pw-road-kicker {
            color: #9ee8bd;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1.4px;
        }

        .pw-road-status {
            color: #ffcf27;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .pw-road-scene {
            position: relative;
            height: 91px;
            overflow: hidden;
            border: 1px solid #ffffff12;
            border-radius: 9px;
            background: linear-gradient(
                #081a28 0%,
                #122d35 58%,
                #163a29 59%,
                #10231c 100%
            );
        }

        .pw-road-scene::before {
            position: absolute;
            right: - 1;
            bottom: 29px;
            left: 0;
            height: 1px;
            background: #9be8bd40;
            box-shadow: 0 0 8px #00ed7520;
            content: "";
        }

        .pw-sky-glow {
            position: absolute;
            top: 8px;
            right: 13%;
            width: 29px;
            height: 29px;
            border-radius: 50%;
            background: #ffcf2730;
            box-shadow: 0 0 20px #ffcf2720;
        }

        .pw-stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(#fff 1px, transparent 1.5px),
                radial-gradient(#b7ffe1 1px, transparent 1.5px);
            background-size: 31px 23px, 47px 31px;
            background-position: 2px 3px, 15px 10px;
            opacity: .55;
            animation: pw-stars 5s linear infinite;
        }

        @keyframes pw-stars {
            from {
                background-position: 2px 3px, 15px 10px;
            }
            to {
                background-position: 33px 26px, 62px 41px;
            }
        }

        /* Road */
        .pw-road {
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 4;
            height: 30px;
            border-top: 2px solid #b4a36d55;
            background: linear-gradient(#3b4147, #202329);
        }

        .pw-road::after {
            position: absolute;
            top: 13px;
            left: 0;
            right: 0;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #f7e7a8 0 14px,
                transparent 14px 26px
            );
            opacity: .7;
            animation: pw-road-dashes 1.1s linear infinite;
            content: "";
        }

        @keyframes pw-road-dashes {
            from { background-position: 0 0; }
            to { background-position:  26px -0; }
        }

        /* Journey progress */
        .pw-road-track {
            position: absolute;
            right: 5%;
            bottom: 31px;
            left: 5%;
            z-index: 2;
            height: 3px;
            overflow: hidden;
            border-radius: 4px;
            background: #ffffff20;
        }

        .pw-road-progress {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #00ed75, #ffcf27);
            box-shadow: 0 0 8px #00ed7570;
            transform: scaleX(0);
            transform-origin: left center;
            will-change: transform;
        }

        /* Holiday event markers */
        .pw-road-stop {
            position: absolute;
            bottom: 26px;
            left: 0;
            z-index: 3;
            font-size: 15px;
            filter: drop-shadow(0 0 5px #ffcf2770);
            will-change: transform;
        }

        .pw-road-stop::after {
            position: absolute;
            top: 18px;
            left: 50%;
            width: 1px;
            height: 9px;
            background: #fff7;
            content: "";
        }

        /* Walker: JavaScript moves this from A to B */
        .pw-walker {
            position: absolute;
            bottom: 6px;
            left: 0;
            z-index: 5;
            transform: translate3d(0, 0, 0);
            transform-origin: center bottom;
            will-change: transform;
        }

        .pw-walker-emoji {
            display: inline-block;
            font-size: 27px;
            line-height: 1;
            transform-origin: center bottom;
            animation: pw-walk-bob .38s ease-in-out infinite alternate;
        }

        @keyframes pw-walk-bob {
            from { transform: translateY(0) rotate(-3deg); }
            to { transform: translateY(-2px) rotate(3deg); }
        }

        .pw-walker-shadow {
            position: absolute;
            bottom: -2px;
            left: 5px;
            width: 20px;
            height: 4px;
            border-radius: 50%;
            background: #0009;
            filter: blur(2px);
        }

        .pw-destination {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 6;
            max-width: 75%;
            padding: 4px 7px;
            border: 1px solid #ffffff22;
            border-radius: 6px;
            background: #0008;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            text-align: right;
        }

        .pw-road-caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 7px;
            color: #d6d6d6;
            font-size: 9px;
            text-align: left;
        }

        .pw-road-percent {
            color: #00ed75;
            font-weight: 900;
            white-space: nowrap;
        }

        .pw-road-note {
            margin-top: 5px;
            color: #a8b8ae;
            font-size: 8px;
            letter-spacing: .25px;
        }

        /* Promo button */
        .pw-xmas-action {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 9px auto 0;
            padding: 11px 10px;
            border: 1px solid #00ed75;
            border-radius: 9px;
            background: linear-gradient(90deg, #10291c, #171020);
            box-shadow: 0 0 9px #00ed7520;
            color: #00ed75;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
            transition: background .25s, color .25s, box-shadow .25s;
        }

        .pw-xmas-action:hover,
        .pw-xmas-action:focus-visible {
            outline: none;
            background: #00ed75;
            box-shadow: 0 0 17px #00ed7560;
            color: #07150e;
        }

        /* Small mobile screens */
        @media (max-width: 360px) {
            .pw-xmas-footer {
                padding-right: 2px;
                padding-left: 2px;
            }

            .pw-xmas-units {
                gap: 3px;
                padding: 7px 3px;
            }

            .pw-xmas-number {
                font-size: 18px;
            }

            .pw-xmas-label {
                font-size: 7px;
            }

            .pw-road-panel {
                padding: 8px 6px;
            }

            .pw-road-scene {
                height: 85px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pw-mini-brand,
            .pw-xmas-units,
            .pw-stars,
            .pw-road::after,
            .pw-walker-emoji {
                animation: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="pw-xmas-footer" id="pwXmasPromo">
        <div class="pw-mini-brand">
            PISO WIFI.br · HOLIDAY JOURNEY
        </div>

        <div class="pw-xmas-units" aria-label="Christmas countdown">
            <div class="pw-xmas-unit">
                <span class="pw-xmas-number" id="pwDays">--</span>
                <span class="pw-xmas-label">DAYS LEFT</span>
            </div>
            <div class="pw-xmas-unit">
                <span class="pw-xmas-number" id="pwHours">--</span>
                <span class="pw-xmas-label">HOURS</span>
            </div>
            <div class="pw-xmas-unit">
                <span class="pw-xmas-number" id="pwMinutes">--</span>
                <span class="pw-xmas-label">MINUTES</span>
            </div>
            <div class="pw-xmas-unit">
                <span class="pw-xmas-number" id="pwSeconds">--</span>
                <span class="pw-xmas-label">SECONDS</span>
            </div>
        </div>

        <div class="pw-road-panel">
            <div class="pw-road-heading">
                <span class="pw-road-kicker">YOUR HOLIDAY JOURNEY</span>
                <span class="pw-road-status" id="pwRoadStatus">
                    Loading journey…
                </span>
            </div>

            <div
                class="pw-road-scene"
                role="img"
                aria-label="A person walks right along a holiday road while the next event approaches"
            >
                <div class="pw-stars"></div>
                <div class="pw-sky-glow"></div>

                <div class="pw-road-track">
                    <div class="pw-road-progress" id="pwRoadProgress"></div>
                </div>

                <div class="pw-destination" id="pwDestination">
                    🎄 CHRISTMAS
                </div>

                <div class="pw-road-stop" id="pwStop1">🕯️</div>
                <div class="pw-road-stop" id="pwStop2">🎄</div>
                <div class="pw-road-stop" id="pwStop3">🎆</div>

                <div class="pw-walker" id="pwWalker">
                    <span class="pw-walker-emoji" id="pwWalkerEmoji">🚶</span>
                    <span class="pw-walker-shadow"></span>
                </div>

                <div class="pw-road"></div>
            </div>

            <div class="pw-road-caption">
                <span id="pwNextEvent">Preparing your next holiday stop…</span>
                <span class="pw-road-percent" id="pwJourneyPercent">0%</span>
            </div>

            <div class="pw-road-note" id="pwRoadNote">
                Live calendar · The journey updates automatically
            </div>
        </div>

        <!-- Replace #voucher with the real promo page URL or hotspot voucher link. -->
        <a class="pw-xmas-action" href="#voucher">
            🎄 TAP HERE · CHRISTMAS PROMO 🎁
        </a>
    </div>

    <script>
        (() => {
            "use strict";

            const $ = id => document.getElementById(id);

            const el = {
                days: $("pwDays"),
                hours: $("pwHours"),
                minutes: $("pwMinutes"),
                seconds: $("pwSeconds"),
                walker: $("pwWalker"),
                walkerEmoji: $("pwWalkerEmoji"),
                progress: $("pwRoadProgress"),
                status: $("pwRoadStatus"),
                destination: $("pwDestination"),
                next: $("pwNextEvent"),
                percent: $("pwJourneyPercent"),
                note: $("pwRoadNote"),
                stops: [$("pwStop1"), $("pwStop2"), $("pwStop3")]
            };

            const scene = document.querySelector(".pw-road-scene");
            const reduceMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );

            const DAY_MS = 24 * 60 * 60 * 1000;
            let animationFrame = 0;
            let lastSecond = -1;

            function localDate(year, month, day) {
                return new Date(year, month - 1, day, 0, 0, 0, 0);
            }

            function getEvents(now) {
                const currentYear = now.getFullYear();

                const template = [
                    {
                        month: 11,
                        day: 1,
                        name: "All Saints’ Day",
                        short: "ALL SAINTS",
                        icon: "🕯️",
                        walker: "🚶",
                        description: "Remembering and honoring loved ones"
                    },
                    {
                        month: 11,
                        day: 2,
                        name: "All Souls’ Day",
                        short: "ALL SOULS",
                        icon: "🕯️",
                        walker: "🚶",
                        description: "A moment for remembrance"
                    },
                    {
                        month: 12,
                        day: 25,
                        name: "Christmas Day",
                        short: "CHRISTMAS",
                        icon: "🎄",
                        walker: "🎅",
                        description: "Christmas magic and festive rewards"
                    },
                    {
                        month: 12,
                        day: 31,
                        name: "New Year’s Eve",
                        short: "NEW YEAR",
                        icon: "🎆",
                        walker: "🎅",
                        description: "Counting down to a fresh beginning"
                    },
                    {
                        month: 1,
                        day: 1,
                        name: "New Year’s Day",
                        short: "NEW YEAR",
                        icon: "🎆",
                        walker: "🎉",
                        description: "Welcome a brand-new year"
                    }
                ];

                const events = [];

                for (let yearOffset = -1; yearOffset <= 2; yearOffset++) {
                    for (const item of template) {
                        events.push({
                            ...item,
                            date: localDate(
                                currentYear + yearOffset,
                                item.month,
                                item.day
                            )
                        });
                    }
                }

                return events.sort((a, b) => a.date - b.date);
            }

            function formatRemaining(milliseconds) {
                if (milliseconds <= 0) return "Arrived!";

                const totalSeconds = Math.floor(milliseconds / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);

                if (days > 0) return `${days}d ${hours}h to go`;
                if (hours > 0) return `${hours}h ${minutes}m to go`;
                return `${minutes}m to go`;
            }

            function easeInOut(value) {
                return value * value * (3 - 2 * value);
            }

            function moveElement(element, x, scale = 1) {
                element.style.transform =
                    `translate3d(${x}px, 0, 0) scale(${scale})`;
            }

            function updateCountdown(now) {
                const currentSecond = Math.floor(now.getTime() / 1000);
                if (currentSecond === lastSecond) return;

                lastSecond = currentSecond;

                let christmas = localDate(now.getFullYear(), 12, 25);
                if (now >= christmas) {
                    christmas = localDate(now.getFullYear() + 1, 12, 25);
                }

                const remaining = Math.max(0, christmas.getTime() - now.getTime());

                el.days.textContent = Math.floor(remaining / DAY_MS);
                el.hours.textContent = String(
                    Math.floor(remaining / 3600000) % 24
                ).padStart(2, "0");
                el.minutes.textContent = String(
                    Math.floor(remaining / 60000) % 60
                ).padStart(2, "0");
                el.seconds.textContent = String(
                    Math.floor(remaining / 1000) % 60
                ).padStart(2, "0");
            }

            function render(now) {
                if (!scene) return;

                const sceneWidth = scene.clientWidth;
                const startX = Math.max(12, sceneWidth * 0.05);
                const endX = sceneWidth - Math.max(18, sceneWidth * 0.07);
                const travelWidth = Math.max(0, endX - startX);

                const events = getEvents(now);
                let nextIndex = events.findIndex(event => event.date > now);

                if (nextIndex === -1) {
                    nextIndex = events.length - 1;
                }

                const next = events[nextIndex];
                const previous = events[Math.max(0, nextIndex - 1)];

                const interval = next.date.getTime() - previous.date.getTime();
                const elapsed = now.getTime() - previous.date.getTime();

                const journey = interval > 0
                    ? Math.max(0, Math.min(1, elapsed / interval))
                    : 0;

                const easedJourney = easeInOut(journey);
                const walkerX = startX + travelWidth * easedJourney;
                const approachingEventX = endX - travelWidth * easedJourney;

                // Scale increases gradually across the journey, capped at 1.35x.
                const scale = 1 + 0.35 * easedJourney;

                // Walker travels from A (left) toward B (right).
                const walkerHalfWidth = (el.walker.offsetWidth || 27) / 2;
                moveElement(el.walker, walkerX - walkerHalfWidth, scale);

                // The next event marker approaches from B toward A.
                moveElement(el.stops[1], approachingEventX - 8);

                el.progress.style.transform = `scaleX(${journey})`;
                el.percent.textContent = `${Math.round(journey * 100)}%`;

                el.status.textContent = next.name.toUpperCase();
                el.destination.textContent = `${next.icon} ${next.short}`;
                el.walkerEmoji.textContent = next.walker;
                el.next.textContent =
                    `${next.icon} ${next.name} · ${formatRemaining(next.date - now)}`;
                el.note.textContent = `${next.description} · Live local time`;

                const markers = [
                    { month: 11, day: 2, icon: "🕯️" },
                    { month: 12, day: 25, icon: "🎄" },
                    { month: 1, day: 1, icon: "🎆" }
                ];

                const markerPositions = [0.15, 0.50, 0.85];

                markers.forEach((marker, index) => {
                    // Stop 2 is reserved for the moving next-event marker.
                    if (index !== 1) {
                        const markerX =
                            startX + travelWidth * markerPositions[index];
                        moveElement(el.stops[index], markerX - 8);
                    }

                    let markerDate = localDate(
                        now.getFullYear(),
                        marker.month,
                        marker.day
                    );

                    const today = localDate(
                        now.getFullYear(),
                        now.getMonth() + 1,
                        now.getDate()
                    );

                    if (markerDate < today) {
                        markerDate = localDate(
                            now.getFullYear() + 1,
                            marker.month,
                            marker.day
                        );
                    }

                    el.stops[index].textContent = marker.icon;
                    el.stops[index].title = markerDate.toLocaleDateString(
                        undefined,
                        { month: "short", day: "numeric" }
                    );
                });

                updateCountdown(now);
            }

            function animate() {
                render(new Date());

                if (!reduceMotion.matches) {
                    animationFrame = window.requestAnimationFrame(animate);
                }
            }

            function startAnimation() {
                if (animationFrame) {
                    window.cancelAnimationFrame(animationFrame);
                    animationFrame = 0;
                }

                render(new Date());

                if (!reduceMotion.matches) {
                    animationFrame = window.requestAnimationFrame(animate);
                }
            }

            if (reduceMotion.addEventListener) { 
                reduceMotion.addEventListener("change", startAnimation);
            } else if (reduceMotion.addListener) {
                reduceMotion.addListener(startAnimation);
            }

            window.addEventListener("resize", startAnimation);
            startAnimation();
        })();
    </script>
</body>
</html>
