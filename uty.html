<script>
(function () {
    "use strict";

    const $ = id => document.getElementById(id);

    const el = {
        days: $("pwDays"),
        hours: $("pwHours"),
        minutes: $("pwMinutes"),
        seconds: $("pwSeconds"),
        walker: $("pwWalker"),
        walkerEmoji: $("pwWalkerEmoji"),
        progress: $("pwRoadProgress"),
        status: $("pwRoadStatus"),
        destination: $("pwDestination"),
        next: $("pwNextEvent"),
        percent: $("pwJourneyPercent"),
        note: $("pwRoadNote"),
        stops: [
            $("pwStop1"),
            $("pwStop2"),
            $("pwStop3")
        ]
    };

    // Uses the visitor's local device time.
    // For visitors in the Philippines, this will normally be Philippine time.
    function localDate(year, month, day) {
        return new Date(year, month - 1, day, 0, 0, 0, 0);
    }

    function upcomingEvents(now) {
        const y = now.getFullYear();

        const template = [
            {
                month: 11,
                day: 1,
                name: "All Saints’ Day",
                short: "ALL SAINTS",
                icon: "🕯️",
                walker: "🚶",
                description: "Remembering and honoring loved ones"
            },
            {
                month: 11,
                day: 2,
                name: "All Souls’ Day",
                short: "ALL SOULS",
                icon: "🕯️",
                walker: "🚶",
                description: "A moment for remembrance"
            },
            {
                month: 12,
                day: 25,
                name: "Christmas Day",
                short: "CHRISTMAS",
                icon: "🎄",
                walker: "🎅",
                description: "Christmas magic and festive rewards"
            },
            {
                month: 12,
                day: 31,
                name: "New Year’s Eve",
                short: "NEW YEAR",
                icon: "🎆",
                walker: "🎅",
                description: "Counting down to a fresh beginning"
            },
            {
                month: 1,
                day: 1,
                name: "New Year’s Day",
                short: "NEW YEAR",
                icon: "🎆",
                walker: "🎉",
                description: "Welcome a brand-new year"
            }
        ];

        // Build three years so the road always has a previous
        // milestone and a next milestone, including around New Year.
        const events = [];

        for (let yr = y - 1; yr <= y + 1; yr++) {
            template.forEach(event => {
                events.push({
                    ...event,
                    date: localDate(yr, event.month, event.day)
                });
            });
        }

        return events.sort((a, b) => a.date - b.date);
    }

    function formatRemaining(ms) {
        if (ms <= 0) return "Arrived!";

        const total = Math.floor(ms / 1000);
        const days = Math.floor(total / 86400);
        const hours = Math.floor((total % 86400) / 3600);
        const mins = Math.floor((total % 3600) / 60);

        if (days > 0) return days + "d " + hours + "h to go";
        if (hours > 0) return hours + "h " + mins + "m to go";

        return mins + "m to go";
    }

    function update() {
        const now = new Date();
        const year = now.getFullYear();

        // Christmas countdown
        let christmas = new Date(year, 11, 25, 0, 0, 0, 0);

        if (now >= christmas) {
            christmas.setFullYear(year + 1);
        }

        const remaining = Math.max(0, christmas - now);

        el.days.textContent = Math.floor(
            remaining / 86400000
        );

        el.hours.textContent = String(
            Math.floor(remaining / 3600000) % 24
        ).padStart(2, "0");

        el.minutes.textContent = String(
            Math.floor(remaining / 60000) % 60
        ).padStart(2, "0");

        el.seconds.textContent = String(
            Math.floor(remaining / 1000) % 60
        ).padStart(2, "0");

        // Determine the next holiday milestone.
        const events = upcomingEvents(now);

        let nextIndex = events.findIndex(event => event.date > now);

        if (nextIndex < 0) {
            nextIndex = events.length - 1;
        }

        const next = events[nextIndex];
        const previous = events[Math.max(0, nextIndex - 1)];

        const start = previous.date.getTime();
        const end = next.date.getTime();

        let journey = end > start
            ? (now.getTime() - start) / (end - start)
            : 0;

        journey = Math.max(0, Math.min(1, journey));

        // Animate the character and progress bar.
        const left = 5 + journey * 88;

        el.walker.style.left = left + "%";
        el.progress.style.width = (journey * 100) + "%";
        el.percent.textContent = Math.round(journey * 100) + "%";

        el.status.textContent = next.name.toUpperCase();
        el.destination.textContent = next.icon + " " + next.short;
        el.walkerEmoji.textContent = next.walker;

        // Use textContent for safe display of event information.
        el.next.textContent =
            next.icon + " " + next.name + " · " +
            formatRemaining(next.date - now);

        el.note.textContent =
            next.description + " · Live local time";

        // Update seasonal milestone markers.
        const markerEvents = [
            { month: 11, day: 2, icon: "🕯️" },
            { month: 12, day: 25, icon: "🎅" },
            { month: 1, day: 1, icon: "🎆" }
        ];

        markerEvents.forEach((marker, index) => {
            let date = new Date(
                now.getFullYear(),
                marker.month - 1,
                marker.day
            );

            if (
                date < new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate()
                )
            ) {
                date.setFullYear(date.getFullYear() + 1);
            }

            el.stops[index].textContent = marker.icon;
            el.stops[index].title = date.toLocaleDateString(
                undefined,
                { month: "short", day: "numeric" }
            );
        });
    }

    // Initial display, followed by live one-second updates.
    update();
    window.setInterval(update, 1000);
})();
</script>
